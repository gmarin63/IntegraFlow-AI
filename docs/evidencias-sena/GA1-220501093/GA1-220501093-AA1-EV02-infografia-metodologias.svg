<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<defs><linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#1769e0"/><stop offset="1" stop-color="#16b978"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#102a5c}.title{font-size:46px;font-weight:700}.sub{font-size:24px}.head{font-size:30px;font-weight:700;fill:white}.name{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.label{font-size:19px;font-weight:700}.good{fill:#138a55}.bad{fill:#c62828}</style></defs>
<rect width="1200" height="1800" fill="#fff"/>
<rect x="0" y="0" width="1200" height="150" fill="url(#brand)"/>
<text x="55" y="62" class="title" fill="white">IntegraFlow AI</text><text x="55" y="105" class="sub" fill="white">Plataforma inteligente para la automatización de procesos empresariales</text>
<text x="600" y="205" text-anchor="middle" class="title">METODOLOGÍAS DE DESARROLLO DE SOFTWARE</text><text x="600" y="245" text-anchor="middle" class="sub">3 marcos ágiles + 3 marcos tradicionales | características, ventajas y desventajas</text>
<rect x="45" y="285" width="1110" height="60" rx="18" fill="url(#brand)"/><text x="600" y="325" text-anchor="middle" class="head">MARCOS DE TRABAJO ÁGILES</text>
<!-- agile cards -->
<g transform="translate(45,370)"><rect width="350" height="610" rx="18" fill="#f7fbff" stroke="#1769e0" stroke-width="3"/><text x="20" y="42" class="name">1. SCRUM</text><text x="20" y="76" class="body">Iterativo e incremental; organiza</text><text x="20" y="100" class="body">el trabajo en Sprints.</text><text x="20" y="145" class="label">CARACTERÍSTICAS</text><text x="25" y="175" class="body">• Product Backlog y Sprint Backlog</text><text x="25" y="203" class="body">• Roles: Product Owner, Scrum</text><text x="40" y="228" class="body">Master y equipo de desarrollo</text><text x="25" y="258" class="body">• Daily, Review y Retrospective</text><text x="20" y="305" class="label good">VENTAJAS</text><text x="25" y="335" class="body">• Entregas frecuentes de valor</text><text x="25" y="363" class="body">• Alta adaptación al cambio</text><text x="25" y="391" class="body">• Retroalimentación continua</text><text x="20" y="440" class="label bad">DESVENTAJAS</text><text x="25" y="470" class="body">• Requiere compromiso constante</text><text x="25" y="498" class="body">• Puede perder foco sin priorización</text><text x="25" y="526" class="body">• Dependencia de la colaboración</text></g>
<g transform="translate(425,370)"><rect width="350" height="610" rx="18" fill="#f7fffc" stroke="#16a98a" stroke-width="3"/><text x="20" y="42" class="name">2. KANBAN</text><text x="20" y="76" class="body">Visualiza el flujo y limita el</text><text x="20" y="100" class="body">trabajo en progreso (WIP).</text><text x="20" y="145" class="label">CARACTERÍSTICAS</text><text x="25" y="175" class="body">• Tablero visual</text><text x="25" y="203" class="body">• Flujo continuo</text><text x="25" y="231" class="body">• Límites WIP</text><text x="25" y="259" class="body">• Mejora continua</text><text x="20" y="305" class="label good">VENTAJAS</text><text x="25" y="335" class="body">• Gran visibilidad del trabajo</text><text x="25" y="363" class="body">• Fácil de implementar</text><text x="25" y="391" class="body">• Reduce cuellos de botella</text><text x="20" y="440" class="label bad">DESVENTAJAS</text><text x="25" y="470" class="body">• Requiere disciplina con WIP</text><text x="25" y="498" class="body">• No define roles o eventos</text><text x="25" y="526" class="body">• Puede complicarse a gran escala</text></g>
<g transform="translate(805,370)"><rect width="350" height="610" rx="18" fill="#f7fbff" stroke="#1769e0" stroke-width="3"/><text x="20" y="42" class="name">3. EXTREME PROGRAMMING (XP)</text><text x="20" y="76" class="body">Enfoque ágil centrado en</text><text x="20" y="100" class="body">prácticas técnicas de calidad.</text><text x="20" y="145" class="label">CARACTERÍSTICAS</text><text x="25" y="175" class="body">• TDD e integración continua</text><text x="25" y="203" class="body">• Programación en parejas</text><text x="25" y="231" class="body">• Refactorización</text><text x="25" y="259" class="body">• Entregas pequeñas y frecuentes</text><text x="20" y="305" class="label good">VENTAJAS</text><text x="25" y="335" class="body">• Alta calidad del software</text><text x="25" y="363" class="body">• Respuesta rápida a cambios</text><text x="25" y="391" class="body">• Reduce riesgos técnicos</text><text x="20" y="440" class="label bad">DESVENTAJAS</text><text x="25" y="470" class="body">• Requiere equipo capacitado</text><text x="25" y="498" class="body">• Escalabilidad más compleja</text><text x="25" y="526" class="body">• Exige alta colaboración</text></g>
<rect x="45" y="1015" width="1110" height="60" rx="18" fill="url(#brand)"/><text x="600" y="1055" text-anchor="middle" class="head">MARCOS DE TRABAJO TRADICIONALES</text>
<!-- traditional cards -->
<g transform="translate(45,1100)"><rect width="350" height="480" rx="18" fill="#f7fbff" stroke="#1769e0" stroke-width="3"/><text x="20" y="42" class="name">1. CASCADA (WATERFALL)</text><text x="20" y="76" class="body">Modelo secuencial con fases</text><text x="20" y="100" class="body">definidas y planificadas.</text><text x="20" y="145" class="label">CARACTERÍSTICAS</text><text x="25" y="175" class="body">• Requisitos → Diseño → Desarrollo</text><text x="25" y="203" class="body">• Pruebas → Despliegue → Mantenimiento</text><text x="25" y="231" class="body">• Documentación extensa</text><text x="20" y="275" class="label good">VENTAJAS</text><text x="25" y="305" class="body">• Planificación clara</text><text x="25" y="333" class="body">• Fácil de gestionar</text><text x="20" y="375" class="label bad">DESVENTAJAS</text><text x="25" y="405" class="body">• Poca flexibilidad al cambio</text><text x="25" y="433" class="body">• Errores pueden detectarse tarde</text></g>
<g transform="translate(425,1100)"><rect width="350" height="480" rx="18" fill="#f7fffc" stroke="#16a98a" stroke-width="3"/><text x="20" y="42" class="name">2. MODELO ESPIRAL</text><text x="20" y="76" class="body">Combina ciclos iterativos con</text><text x="20" y="100" class="body">análisis y gestión de riesgos.</text><text x="20" y="145" class="label">CARACTERÍSTICAS</text><text x="25" y="175" class="body">• Ciclos o espirales</text><text x="25" y="203" class="body">• Análisis de riesgos</text><text x="25" y="231" class="body">• Prototipos y versiones</text><text x="20" y="275" class="label good">VENTAJAS</text><text x="25" y="305" class="body">• Gestión proactiva de riesgos</text><text x="25" y="333" class="body">• Flexible para proyectos complejos</text><text x="20" y="375" class="label bad">DESVENTAJAS</text><text x="25" y="405" class="body">• Costoso de gestionar</text><text x="25" y="433" class="body">• Requiere experiencia</text></g>
<g transform="translate(805,1100)"><rect width="350" height="480" rx="18" fill="#f7fbff" stroke="#1769e0" stroke-width="3"/><text x="20" y="42" class="name">3. MODELO EN V</text><text x="20" y="76" class="body">Relaciona cada fase de desarrollo</text><text x="20" y="100" class="body">con una fase de prueba.</text><text x="20" y="145" class="label">CARACTERÍSTICAS</text><text x="25" y="175" class="body">• Verificación y validación</text><text x="25" y="203" class="body">• Pruebas planificadas desde el inicio</text><text x="25" y="231" class="body">• Trazabilidad</text><text x="20" y="275" class="label good">VENTAJAS</text><text x="25" y="305" class="body">• Alta atención a las pruebas</text><text x="25" y="333" class="body">• Detecta errores temprano</text><text x="20" y="375" class="label bad">DESVENTAJAS</text><text x="25" y="405" class="body">• Rígido ante cambios</text><text x="25" y="433" class="body">• Mayor esfuerzo documental</text></g>
<rect x="45" y="1620" width="1110" height="120" rx="18" fill="#eef7ff" stroke="#1769e0" stroke-width="2"/><text x="70" y="1655" class="label">APLICACIÓN A INTEGRAFLOW AI</text><text x="70" y="1685" class="body">Se recomienda un enfoque ágil, especialmente Scrum, por la evolución de requisitos, las historias de usuario,</text><text x="70" y="1712" class="body">la priorización y la necesidad de retroalimentación continua. GitHub Projects puede apoyar la gestión del trabajo.</text><text x="70" y="1739" class="small">Fuentes: Agile Manifesto · Scrum Guide · Sommerville, Software Engineering · Pressman, Software Engineering.</text>
</svg>