<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<style>
.title{font:700 30px Arial;fill:#172033}.subtitle{font:400 17px Arial;fill:#334155}.head{font:700 22px Arial;fill:#fff}.section{font:700 18px Arial;fill:#172033}.box{font:700 17px Arial;fill:#172033}.txt{font:400 14px Arial;fill:#334155}.small{font:400 13px Arial;fill:#475569}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrowBlue)}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3155d8"/><stop offset="1" stop-color="#7044d8"/></linearGradient>
</defs>
<rect width="1400" height="900" fill="#fff"/>
<text x="50" y="55" class="title">Arquitectura Conceptual — IntegraFlow AI</text>
<text x="50" y="85" class="subtitle">Plataforma web para automatización e integración de procesos empresariales mediante IA.</text>
<rect x="220" y="120" width="960" height="95" rx="16" fill="url(#g)"/>
<text x="700" y="160" text-anchor="middle" class="head" font-size="30">IntegraFlow AI</text>
<text x="700" y="190" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18">Plataforma Web de Automatización e Integración Empresarial</text>
<path d="M700 215 V245" class="arrow"/>
<!-- users -->
<rect x="45" y="270" width="170" height="210" rx="14" fill="#f8fbff" stroke="#5b8def" stroke-width="2"/>
<text x="130" y="305" text-anchor="middle" class="box">USUARIOS</text>
<text x="70" y="345" class="txt">• Administradores</text><text x="70" y="375" class="txt">• Usuarios</text><text x="70" y="405" class="txt">• Roles y permisos</text>
<path d="M215 370 H250" class="arrow"/>
<!-- modules -->
<rect x="250" y="245" width="930" height="265" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="715" y="275" text-anchor="middle" class="section">MÓDULOS PRINCIPALES</text>
<g>
<rect x="275" y="300" width="165" height="170" rx="12" fill="#f8fbff" stroke="#8ab0ff"/><text x="357" y="335" text-anchor="middle" class="box">CRM</text><text x="292" y="365" class="small">Gestión de clientes</text><text x="292" y="390" class="small">Contactos</text><text x="292" y="415" class="small">Oportunidades</text><text x="292" y="440" class="small">Actividades</text>
<rect x="460" y="300" width="165" height="170" rx="12" fill="#f7fff9" stroke="#7ac58d"/><text x="542" y="335" text-anchor="middle" class="box">RRHH</text><text x="477" y="365" class="small">Empleados</text><text x="477" y="390" class="small">Contratos</text><text x="477" y="415" class="small">Nómina</text><text x="477" y="440" class="small">Vacaciones</text>
<rect x="645" y="300" width="165" height="170" rx="12" fill="#fffaf2" stroke="#f2a34a"/><text x="727" y="335" text-anchor="middle" class="box">CONTABILIDAD</text><text x="662" y="365" class="small">Facturas</text><text x="662" y="390" class="small">Cuentas por pagar</text><text x="662" y="415" class="small">Cuentas por cobrar</text><text x="662" y="440" class="small">Reportes contables</text>
<rect x="830" y="300" width="165" height="170" rx="12" fill="#fbf7ff" stroke="#a778df"/><text x="912" y="335" text-anchor="middle" class="box">DOCUMENTOS</text><text x="847" y="365" class="small">Gestión documental</text><text x="847" y="390" class="small">Almacenamiento</text><text x="847" y="415" class="small">Versionado</text><text x="847" y="440" class="small">Permisos</text>
<rect x="1015" y="300" width="140" height="170" rx="12" fill="#f4fbfb" stroke="#5bb9bd"/><text x="1085" y="335" text-anchor="middle" class="box">REPORTES</text><text x="1032" y="365" class="small">Dashboards</text><text x="1032" y="390" class="small">Indicadores</text><text x="1032" y="415" class="small">Análisis</text><text x="1032" y="440" class="small">Exportación</text>
</g>
<!-- integrations -->
<rect x="1210" y="270" width="150" height="270" rx="14" fill="#fbf9ff" stroke="#8b6be8" stroke-width="2"/>
<text x="1285" y="305" text-anchor="middle" class="box">INTEGRACIONES</text><text x="1230" y="350" class="box">Gmail</text><text x="1230" y="372" class="small">Correo</text><text x="1230" y="410" class="box">DIAN API</text><text x="1230" y="432" class="small">Facturación</text><text x="1230" y="470" class="box">WhatsApp</text><text x="1230" y="492" class="small">Notificaciones</text><text x="1230" y="525" class="small">Otras APIs</text>
<path d="M1180 390 H1210" class="dash"/>
<!-- AI -->
<rect x="250" y="555" width="930" height="130" rx="16" fill="#faf7ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="715" y="590" text-anchor="middle" class="section">MOTOR IA + AUTOMATIZACIÓN</text>
<text x="310" y="630" class="txt">Automatización de procesos</text><text x="520" y="630" class="txt">Reglas y condiciones</text><text x="710" y="630" class="txt">Inteligencia Artificial</text><text x="900" y="630" class="txt">Ejecución de flujos</text><text x="1040" y="630" class="txt">Monitoreo y alertas</text>
<path d="M715 510 V555" class="arrow"/>
<!-- flows -->
<rect x="250" y="720" width="930" height="80" rx="14" fill="#f5fff8" stroke="#7ac58d" stroke-width="2"/>
<text x="715" y="750" text-anchor="middle" class="section">FLUJO DE AUTOMATIZACIÓN</text>
<text x="300" y="778" class="txt">Evento / Disparador</text><text x="520" y="778" class="txt">→ Condición →</text><text x="700" y="778" class="txt">Acción automática →</text><text x="950" y="778" class="txt">Resultado</text>
<path d="M715 686 V720" class="dash"/>
<!-- database -->
<rect x="250" y="825" width="930" height="50" rx="12" fill="#f4f8ff" stroke="#5b8def" stroke-width="2"/>
<text x="715" y="856" text-anchor="middle" class="box">BASE DE DATOS CENTRALIZADA • Seguridad • Integridad • Respaldo • Escalabilidad</text>
<path d="M130 480 V850 H250" class="dash"/>
</svg>